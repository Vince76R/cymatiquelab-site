<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">CymatiqueLab symbol</title>
<desc id="desc">A glowing cymatic symbol with concentric waves.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#11143A"/>
    <stop offset="55%" stop-color="#070713"/>
    <stop offset="100%" stop-color="#020208"/>
  </radialGradient>
  <linearGradient id="line" x1="80" y1="78" x2="430" y2="438">
    <stop stop-color="#FFE88A"/>
    <stop offset="0.48" stop-color="#A782FF"/>
    <stop offset="1" stop-color="#19D9FF"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="512" height="512" rx="104" fill="url(#bg)"/>
<g transform="translate(256 256)" filter="url(#glow)">
  <circle r="148" stroke="url(#line)" stroke-width="5" opacity="0.88"/>
  <circle r="106" stroke="url(#line)" stroke-width="4" opacity="0.64"/>
  <circle r="62" stroke="#FFF7D1" stroke-width="3" opacity="0.82"/>
  <circle r="12" fill="#FFF7D1"/>
  <path d="M-168 0 C-92 -66 -44 -66 0 0 C44 66 92 66 168 0" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M0 -168 C66 -92 66 -44 0 0 C-66 44 -66 92 0 168" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M-118 -118 C-58 -96 -28 -49 0 0 C28 49 58 96 118 118" stroke="#A782FF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M118 -118 C58 -96 28 -49 0 0 C-28 49 -58 96 -118 118" stroke="#19D9FF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</g>
</svg>
